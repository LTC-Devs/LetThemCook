services:
  database:
    image: postgres:15-alpine
    restart: always
    shm_size: 128mb

    volumes:
    - database_data:/var/lib/postgresql/data

    ports:
    - "5432:5432"

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  db_migration:
    image: ltc/backend:latest

    command: >
      sh -c "python ./manage.py migrate --noinput && sh -c 'python ./manage.py createsuperuser --noinput || true'"
    
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_ADMIN_USER}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_ADMIN_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_ADMIN_PASSWORD}
    
    depends_on:
      database:
        condition: service_healthy
  

  backend:
    image: ltc/backend:latest
    build:
      context: backend

    ports:
    - "8000:8000"

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      LTC_DEMO_MODE: ${LTC_DEMO_MODE}

    depends_on:
      database:
        condition: service_healthy
      db_migration:
        condition: service_completed_successfully
    
    healthcheck:
      test:
      - CMD-SHELL 
      - >-
      - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
  

  frontend:
    image: ltc/frontend:latest
    build:
      context: frontend
    
    ports:
    - "3000:3000"

    environment:
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}
    
    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  database_data:
